springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.configUrl=/openapi/swagger-config
springdoc.swagger-ui.url=/openapi
springdoc.api-docs.path=/openapi
server.forward-headers-strategy=native
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=50MB
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
pdf.max-pages=100
pdf.render-dpi=300

supabase.auth.url=${SUPABASE_AUTH_URL}
supabase.auth.publishable-key=${SUPABASE_AUTH_PUBLISHABLE_KEY}
supabase.auth.redirect-uri=${SUPABASE_AUTH_REDIRECT_URI:http://localhost:8080/auth/callback}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${supabase.auth.url}/auth/v1
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${supabase.auth.url}/auth/v1/.well-known/jwks.json
spring.security.oauth2.resourceserver.jwt.jws-algorithms=ES256,RS256
spring.security.oauth2.resourceserver.jwt.audiences[0]=authenticated
